<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="史素香 · 个人简历 · 云计算 / 人工智能方向 · 鲁东大学统计学专业">
<title>史素香 · 简历</title>
<style>
/* ============ 设计变量：科技感深色风 ============ */
:root{
  --bg:#070b16;
  --bg-2:#0b1120;
  --surface:rgba(148,180,255,.05);
  --surface-2:rgba(148,180,255,.09);
  --surface-solid:#0d1426;
  --text:#e9f1ff;
  --text-2:#9fb1d3;
  --text-3:#5e7199;
  --border:rgba(130,165,255,.16);
  --primary:#22d3ee;
  --primary-2:#818cf8;
  --accent:#f472b6;
  --grad:linear-gradient(120deg,#22d3ee 0%,#818cf8 55%,#f472b6 100%);
  --glow-cyan:0 0 26px rgba(34,211,238,.35);
  --glow-violet:0 0 26px rgba(129,140,248,.35);
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f2f6ff;
  --bg-2:#e8eefb;
  --surface:#ffffff;
  --surface-2:#f3f7ff;
  --surface-solid:#ffffff;
  --text:#0e1830;
  --text-2:#3f517a;
  --text-3:#7c8db5;
  --border:#d9e3f6;
  --glow-cyan:0 6px 22px rgba(34,211,238,.25);
  --glow-violet:0 6px 22px rgba(129,140,248,.25);
  --shadow:0 10px 30px rgba(30,60,130,.10);
}

/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.75;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;overflow-x:hidden;
}
::selection{background:var(--primary);color:#03121f}
a{color:var(--primary);text-decoration:none}
.container{width:min(1120px,92%);margin:0 auto}
section{padding:72px 0;position:relative}

/* 网格 + 光斑背景 */
.bg-grid{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    linear-gradient(rgba(130,165,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(130,165,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
}
[data-theme="light"] .bg-grid{background-color:transparent}
.bg-glow{position:fixed;z-index:-1;pointer-events:none;inset:0;overflow:hidden}
.glow-orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.orb-1{width:520px;height:520px;top:-160px;right:-100px;background:radial-gradient(circle,#22d3ee33,transparent 65%);animation:drift1 16s ease-in-out infinite}
.orb-2{width:460px;height:460px;top:40%;left:-180px;background:radial-gradient(circle,#818cf833,transparent 65%);animation:drift2 20s ease-in-out infinite}
.orb-3{width:420px;height:420px;bottom:-140px;right:16%;background:radial-gradient(circle,#f472b62b,transparent 65%);animation:drift1 24s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,40px) scale(1.05)}}

.section-tag{
  font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:3px;
  color:var(--primary);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.section-tag::before{content:"//";color:var(--accent)}
.section-title{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:.5px}
.section-sub{color:var(--text-2);margin-top:8px;font-size:15px;max-width:640px}
.muted{color:var(--text-3)}

/* ============ 导航栏 ============ */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s;
}
.navbar.scrolled{border-bottom:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.28)}
.nav-inner{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--text)}
.brand-logo{
  width:32px;height:32px;border-radius:9px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#06121f;
  box-shadow:var(--glow-cyan);position:relative;
}
.brand-logo::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:1px solid rgba(34,211,238,.4);opacity:.6}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{
  color:var(--text-2);font-size:14px;font-weight:600;padding:7px 13px;border-radius:9px;position:relative;
  transition:color .18s,background .18s;
}
.nav-links a:hover{color:var(--primary)}
.nav-links a.active{color:var(--primary)}
.nav-links a.active::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2px;border-radius:2px;background:var(--grad)}
.nav-actions{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .18s,border-color .18s,transform .18s,box-shadow .18s;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--glow-cyan)}
.icon-btn svg{width:16.5px;height:16.5px}
.burger{display:none}
.mobile-menu{display:none;flex-direction:column;padding:12px 18px 16px;border-top:1px solid var(--border);background:var(--bg)}
.mobile-menu a{padding:11px 6px;color:var(--text-2);font-weight:600;font-size:15px;border-bottom:1px dashed var(--border)}
.mobile-menu a:last-child{border-bottom:none}
.mobile-menu.open{display:flex}

/* ============ Hero ============ */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:120px 0 70px;position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;top:-160px;left:50%;transform:translateX(-50%);
  width:820px;height:480px;border-radius:50%;background:radial-gradient(closest-side,rgba(34,211,238,.16),transparent);filter:blur(20px);
  z-index:1;pointer-events:none;
}
.hero-inner{width:min(900px,94%);margin:0 auto;text-align:center;position:relative;z-index:3}
/* Hero 水波 WebGL 背景 */
.hero-wave{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.hero-wave-tint{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(125% 115% at 50% 34%, rgba(5,10,20,0) 44%, rgba(5,10,20,.34) 72%, rgba(5,10,20,.72) 100%),
    linear-gradient(180deg, rgba(5,10,20,.5) 0%, rgba(5,10,20,.12) 38%, rgba(5,10,20,.34) 78%, rgba(5,10,20,.8) 100%);
}
[data-theme="light"] .hero-wave,[data-theme="light"] .hero-wave-tint{display:none}
[data-theme="dark"] .hero-type,[data-theme="dark"] .hero-desc,[data-theme="dark"] .hero-badge{text-shadow:0 1px 18px rgba(4,8,18,.85)}

/* Hero 头像 */
.hero-avatar-wrap{display:flex;justify-content:center;margin-bottom:22px}
.hero-avatar{
  width:120px;height:120px;border-radius:50%;object-fit:cover;
  border:2px solid var(--primary);box-shadow:var(--glow-cyan);
  background:var(--surface-solid);
  position:relative;z-index:2;
}
.hero-avatar-ring{
  position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--primary),var(--primary-2),var(--accent),var(--primary));
  animation:ringSpin 6s linear infinite;z-index:1;
  -webkit-mask:radial-gradient(transparent 58%,#000 60%);mask:radial-gradient(transparent 58%,#000 60%);
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.hero-badge{
  display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--text-2);
  margin-bottom:26px;
}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.hero h1{font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:2px;line-height:1.15}
.hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(34,211,238,.35))}
.hero-type{
  font-family:var(--mono);font-size:clamp(17px,2.5vw,21px);color:var(--text-2);margin-top:16px;min-height:36px;
  display:flex;align-items:center;justify-content:center;gap:2px;
}
.cursor{display:inline-block;width:10px;height:24px;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:blink 1s steps(1) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.hero-desc{color:var(--text-2);margin:22px auto 0;max-width:680px;font-size:15.5px;line-height:2}
.hero-desc b{color:var(--primary);font-weight:700}
.hero-desc .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;filter:drop-shadow(0 0 14px rgba(34,211,238,.3))}
.hero-keywords{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.keyword{
  padding:7px 15px;border-radius:8px;font-family:var(--mono);font-size:12.5px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);backdrop-filter:blur(6px);
  transition:transform .18s,border-color .18s,color .18s,box-shadow .18s;
}
.keyword:hover{transform:translateY(-3px);border-color:var(--primary);color:var(--primary);box-shadow:var(--glow-cyan)}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:11px;
  font-size:14.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;
  transition:transform .18s,box-shadow .18s,background .18s;position:relative;overflow:hidden;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--grad);color:#06121f;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,var(--glow-cyan)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 12px 34px rgba(34,211,238,.45)}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%);transition:transform .5s}
.btn-primary:hover::after{transform:translateX(120%)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(6px)}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--primary-2);color:var(--primary-2);box-shadow:var(--glow-violet)}
.hero-scroll{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  color:var(--text-3);font-family:var(--mono);font-size:11px;letter-spacing:2px;display:flex;flex-direction:column;align-items:center;gap:6px;
  z-index:3;
}
.hero-scroll span{width:1px;height:34px;background:linear-gradient(var(--primary),transparent);animation:scrollHint 1.8s ease-in-out infinite}
@keyframes scrollHint{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* ============ 励志格言 ============ */
.motto{max-width:840px;margin:0 auto;text-align:center;padding:10px 0 6px;position:relative}
.motto-text{
  margin:42px auto 8px;font-size:clamp(34px,8vw,62px);line-height:1.45;letter-spacing:.1em;
  font-family:'STXingkai','华文行楷','KaiTi','楷体','YouYuan','幼圆','Microsoft YaHei',serif;
  font-weight:700;cursor:default;
}
.motto-text span{
  display:inline-block;position:relative;z-index:0;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(34,211,238,.4)) drop-shadow(0 4px 20px rgba(244,114,182,.25));
  transition:transform .35s cubic-bezier(.2,.8,.2,1.1),filter .35s;
}
.motto-text span:nth-child(odd){transform:rotate(2deg) translateY(-5px)}
.motto-text span:nth-child(even){transform:rotate(-2.5deg) translateY(12px);font-size:.88em}
.motto-text span:nth-child(3){transform:rotate(-4deg) translateY(-2px)}
.motto-text span:nth-child(7){transform:rotate(3.5deg) translateY(16px)}
.motto-text span:hover{transform:translateY(-10px) rotate(0) scale(1.18);z-index:3;filter:drop-shadow(0 0 22px rgba(34,211,238,.75)) drop-shadow(0 4px 26px rgba(244,114,182,.45))}
.motto-text .motto-punc{
  background:none;-webkit-text-fill-color:currentColor;color:var(--text-3);opacity:.55;
  font-family:Georgia,serif;font-size:.55em;line-height:1;
  transform:translateY(14px) rotate(0);filter:none;margin:0 .08em;
}

/* ============ 技能矩阵 ============ */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.skill-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;
  backdrop-filter:blur(8px);position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.skill-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad);opacity:.35}
.skill-card:hover{transform:translateY(-5px);border-color:var(--primary-2);box-shadow:var(--glow-violet)}
.skill-card h4{font-size:15px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:9px}
.skill-card h4 svg{width:16px;height:16px;color:var(--primary)}
.skill-card .hint{font-size:12px;color:var(--text-3);font-family:var(--mono);margin-bottom:16px}
.skill-row{margin-bottom:13px}
.skill-row:last-child{margin-bottom:0}
.skill-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;font-family:var(--mono)}
.skill-top em{font-style:normal;color:var(--text-3)}
.skill-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.skill-fill{position:relative;overflow:hidden;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width 1.1s cubic-bezier(.22,.8,.35,1);box-shadow:0 0 12px rgba(34,211,238,.5)}
.skill-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.55) 50%,transparent 75%);transform:translateX(-100%);animation:skillShine 2.6s ease-in-out 1.1s infinite}
@keyframes skillShine{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}

/* ============ 项目 ============ */
.proj-filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px}
.filter-btn{
  padding:8px 17px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--text-2);cursor:pointer;
  backdrop-filter:blur(6px);transition:all .18s;
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--grad);color:#06121f;border-color:transparent;box-shadow:var(--glow-cyan)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px}
.proj-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);transition:transform .22s,box-shadow .22s,border-color .22s;
}
.proj-thumb{
  width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,var(--surface-2),var(--surface));
}
.proj-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:11px;flex:1}
.proj-card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--grad);opacity:0;transition:opacity .22s}
.proj-card::after{content:"";position:absolute;top:-40%;right:-30%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.12),transparent 65%);pointer-events:none}
.proj-card:hover{transform:translateY(-6px);border-color:var(--primary);box-shadow:var(--glow-cyan)}
.proj-card:hover::before{opacity:1}
.proj-card.hidden{display:none}
.proj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.proj-title{font-size:16.5px;font-weight:800;line-height:1.4;position:relative;z-index:1}
.proj-time{font-size:12px;color:var(--text-3);font-family:var(--mono);white-space:nowrap;margin-top:3px;position:relative;z-index:1}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.ptag{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--primary);border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.08);padding:2px 10px;border-radius:6px}
.proj-points{list-style:none;flex:1;position:relative;z-index:1}
.proj-points li{position:relative;padding-left:18px;color:var(--text-2);font-size:13.8px;margin-bottom:7px}
.proj-points li::before{content:"▹";position:absolute;left:0;color:var(--accent)}
.proj-metrics{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--border);padding-top:12px;position:relative;z-index:1}
.metric{flex:1;min-width:90px;text-align:center}
.metric b{display:block;font-family:var(--mono);font-size:17px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.metric span{font-size:11px;color:var(--text-3)}

/* ============ 教育证书 ============ */
.edu-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;backdrop-filter:blur(8px)}
.card h3{font-size:16px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:9px}
.card h3 svg{width:17px;height:17px;color:var(--primary)}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent));opacity:.45;border-radius:2px}
.tl-item{position:relative;margin-bottom:22px}
.tl-item:last-child{margin-bottom:0}
.tl-item::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--primary);border:3px solid var(--surface-solid)}
.tl-item h4{font-size:15.5px;font-weight:800}
.tl-item .date{font-family:var(--mono);font-size:12px;color:var(--primary);font-weight:700;margin:3px 0 7px}
.tl-item p{font-size:13.6px;color:var(--text-2)}
/* 证书九宫格 */
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:860px;margin:0 auto}
.cert-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 12px 15px;
  display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;cursor:zoom-in;
  backdrop-filter:blur(8px);transition:transform .22s,box-shadow .22s,border-color .22s;
}
.cert-card::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--grad);opacity:.45}
.cert-card::after{content:"";position:absolute;top:-35%;right:-30%;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.09),transparent 65%);pointer-events:none}
.cert-card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 14px 34px rgba(0,0,0,.35),var(--glow-cyan)}
.cert-frame{
  aspect-ratio:4/3;width:100%;border-radius:9px;overflow:hidden;
  background:linear-gradient(155deg,#f7f9ff 0%,#eef3ff 55%,#e6edff 100%);
  display:flex;align-items:center;justify-content:center;padding:10px;position:relative;
}
.cert-pic{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:3px;
  box-shadow:0 6px 18px rgba(15,30,80,.25);transition:transform .3s}
.cert-card:hover .cert-pic{transform:scale(1.025)}
.cert-zoom{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;
  background:rgba(8,13,30,.5);color:#fff;backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;
}
.cert-card:hover .cert-zoom{opacity:1}
.cert-zoom svg{width:14px;height:14px}
.cert-img{

.cert-img svg{width:22px;height:22px;color:var(--primary)}

}

  opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;padding:24px;
}
.lightbox.open{opacity:1;visibility:visible}
.lightbox figure{
  margin:0;display:flex;flex-direction:column;gap:14px;align-items:center;
  max-width:min(94vw,1200px);max-height:88vh;
}
.lightbox img{
  max-width:min(94vw,1200px);max-height:76vh;object-fit:contain;border-radius:10px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);background:#fff;border:1px solid rgba(255,255,255,.08);
}
.lightbox figcaption{font-size:13.5px;font-weight:600;color:var(--text-2);text-align:center;max-width:760px;line-height:1.6}
.lb-btn{
  position:absolute;border:none;cursor:pointer;z-index:2;
  width:44px;height:44px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:#e9f1ff;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s,border-color .2s;
}
.lb-btn:hover{background:var(--primary);border-color:var(--primary);color:#06121f;transform:scale(1.06)}
.lb-btn svg{width:19px;height:19px}
.lb-close{top:20px;right:20px}
.lb-prev{left:20px;top:50%;transform:translateY(-50%)}
.lb-next{right:20px;top:50%;transform:translateY(-50%)}
.lb-prev:hover{transform:translateY(-50%) scale(1.06)}
.lb-next:hover{transform:translateY(-50%) scale(1.06)}
@media(max-width:640px){.lb-prev{left:6px}.lb-next{right:6px}.lightbox img{max-height:68vh}}

footer{border-top:1px solid var(--border);padding:32px 0;background:color-mix(in srgb,var(--bg-2) 70%,transparent)}
.foot-inner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-3);font-family:var(--mono)}

/* ============ 返回顶部 ============ */
#backTop{
  position:fixed;right:22px;bottom:22px;z-index:90;width:46px;height:46px;border-radius:12px;
  background:var(--surface-solid);border:1px solid var(--primary);color:var(--primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--glow-cyan);
  opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .25s,transform .25s,visibility .25s;
}
#backTop.show{opacity:1;visibility:visible;transform:none}
#backTop:hover{background:var(--primary);color:#06121f}
#backTop svg{width:18px;height:18px}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);
  background:var(--surface-solid);color:var(--text);border:1px solid var(--primary);
  padding:11px 22px;border-radius:11px;font-size:13.5px;font-weight:600;font-family:var(--mono);

.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

/* ============ 科技交互：光标光晕 ============ */
.cursor-glow{

  transform:translate(-50%,-50%);z-index:1;will-change:transform;
}
html[data-theme="light"] .cursor-glow{background:radial-gradient(circle,rgba(34,211,238,.18),rgba(129,140,248,.09) 45%,transparent 70%)}

/* ============ 主题切换：涟漪 + 闪光 + 图标旋转 ============ */
.theme-ripple{
  position:fixed;width:0;height:0;border-radius:50%;pointer-events:none;z-index:999;opacity:0;
  background:radial-gradient(circle,rgba(34,211,238,.30),rgba(129,140,248,.14) 45%,transparent 65%);
  transform:translate(-50%,-50%);
}
.theme-ripple.play{animation:themeRipple .6s ease-out forwards}
@keyframes themeRipple{
  0%{width:0;height:0;opacity:.9}
  100%{width:2200px;height:2200px;opacity:0}
}
#themeBtn svg{transition:transform .4s cubic-bezier(.22,.8,.35,1)}
#themeBtn.rotating svg{transform:rotate(220deg) scale(.8)}
body.theme-switch{animation:themeFlash .45s ease}
@keyframes themeFlash{0%{filter:brightness(1.55) saturate(1.3)}100%{filter:brightness(1) saturate(1)}}

.hero-inner>*{opacity:0;transform:translateY(24px);animation:heroRise .9s cubic-bezier(.22,.8,.35,1) forwards}

.hero-inner>*:nth-child(3){animation-delay:.28s}
.hero-inner>*:nth-child(4){animation-delay:.4s}
.hero-inner>*:nth-child(5){animation-delay:.52s}
.hero-inner>*:nth-child(6){animation-delay:.64s}

.card-spot{

}
.tilt:hover .card-spot{opacity:1}

/* ============ 进入动效 ============ */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.reveal.in-view{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media(max-width:900px){

function renderThemeIcon(t){
  $('#themeBtn').innerHTML = t === 'dark'

function themeRipple(x, y){
  const r = document.createElement('div');
  r.className = 'theme-ripple';
  r.style.left = x + 'px';
  r.style.top = y + 'px';
  document.body.appendChild(r);
  requestAnimationFrame(() => r.classList.add('play'));
  setTimeout(() => r.remove(), 650);
}
$('#themeBtn').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (!btn) return;
  btn.classList.add('rotating');
  setTimeout(() => btn.classList.remove('rotating'), 450);
  const rc = btn.getBoundingClientRect();
  if (rc.width && rc.height) themeRipple(rc.left + rc.width / 2, rc.top + rc.height / 2);
  document.body.classList.add('theme-switch');
  setTimeout(() => document.body.classList.remove('theme-switch'), 500);
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  renderThemeIcon(next);
});

  (function tick(){
    const line = lines[li];
    if (!deleting) {
      el.textContent = line.slice(0, ++ci);
      if (ci === line.length) { deleting = true; setTimeout(tick, 1800); return; }
      setTimeout(tick, 46);
    } else {
      el.textContent = line.slice(0, --ci);
      if (ci === 0) { deleting = false; li = (li + 1) % lines.length; setTimeout(tick, 350); return; }
      setTimeout(tick, 22);

  })();
})();

      if (!card.isConnected) return;
      const r = card.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      card.style.setProperty('--mx', e.clientX - r.left + 'px');
      card.style.setProperty('--my', e.clientY - r.top + 'px');
      card.style.transform = `perspective(700px) rotateY(${px * 13}deg) rotateX(${py * -13}deg) translateY(-6px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
      card.style.setProperty('--mx', '50%');

    });
  });
}

/* ============ Hero 水波 WebGL ============ */
(() => {
  const hero = document.getElementById('home');
  const cv = document.getElementById('heroWave');
  if (!hero || !cv || !window.WebGLRenderingContext) { if (cv) cv.remove(); return; }
  const gl = cv.getContext('webgl', { alpha: true, antialias: false });
  if (!gl) { cv.remove(); return; }

  const VS = `
    attribute vec2 a_position;
    uniform vec2 u_res;
    uniform vec2 u_imgRes;
    uniform float u_scale;
    varying vec2 v_uv;
    varying vec2 v_cover;
    void main(){
      gl_Position = vec4(a_position, 0.0, 1.0);
      v_uv = a_position * 0.5 + 0.5;
      vec2 screenPx = v_uv * u_res;
      vec2 coverPx = u_imgRes * u_scale;
      vec2 off = (u_res - coverPx) * 0.5;
      v_cover = (screenPx - off) / coverPx;
    }
  `;
  const FS = `
    precision highp float;
    varying vec2 v_uv;
    varying vec2 v_cover;
    uniform sampler2D u_image;
    uniform vec2 u_res;
    uniform vec2 u_imgRes;
    uniform float u_scale;
    uniform vec2 u_mouse;
    uniform float u_time;
    uniform float u_act;
    void main(){
      vec2 uv = v_cover;
      // 持续的流体流动（即使鼠标不动，画面也如水般流动）
      vec2 flow = vec2(
        sin(v_uv.y * 6.0 + u_time * 0.55) * 0.0026 + sin(v_uv.y * 17.0 - u_time * 0.8) * 0.0011,
        cos(v_uv.x * 5.5 + u_time * 0.45) * 0.0026
      );
      uv += flow;
      // 鼠标附近的波漾：正弦波 × 指数衰减
      vec2 d = v_uv - u_mouse;
      d.x *= u_res.x / u_res.y;          // 统一横纵比例，涟漪呈正圆扩散
      float dist = length(d);
      float wave  = sin(dist * 40.0 - u_time * 3.4) * exp(-dist * 7.0);
      float wave2 = sin(dist * 16.0 - u_time * 2.0) * exp(-dist * 3.0) * 0.5;
      vec2 dir = dist > 0.0001 ? d / dist : vec2(0.0001, 0.0);
      dir.x /= u_res.x / u_res.y;        // 换回屏幕 UV 空间
      float amp = (wave + wave2) * u_act * 0.035;
      uv += dir * amp * (u_res.x / (u_imgRes.x * u_scale));
      gl_FragColor = texture2D(u_image, clamp(uv, 0.002, 0.998));
    }
  `;
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); gl.deleteShader(s); return null; }
    return s;
  };
  const vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ['u_res', 'u_imgRes', 'u_scale', 'u_mouse', 'u_time', 'u_act', 'u_image'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // 纹理（先 1x1 透明占位，图片就绪后再替换）
  const imgPx = { w: 1, h: 1, scale: 1 };
  let tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    imgPx.w = img.naturalWidth || 1536;
    imgPx.h = img.naturalHeight || 1024;
    imgReady = true;
    resize(); refresh();
  };
  img.onerror = () => { imgFailed = true; if (cv.parentNode) cv.parentNode.removeChild(cv); };

  let W = 0, H = 0;
  function resize() {
    if (cv.offsetParent === null) return;           // light 主题下 display:none 时跳过
    // touch(coarse pointer) devices: cap render pixels at 1x to save ~75% GPU load
    const DPR = matchMedia('(pointer:coarse)').matches ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(2, Math.round(hero.clientWidth * DPR));
    H = Math.max(2, Math.round(hero.clientHeight * DPR));
    if (cv.width !== W) cv.width = W;
    if (cv.height !== H) cv.height = H;
    gl.viewport(0, 0, W, H);
    if (imgReady) imgPx.scale = Math.max(W / imgPx.w, H / imgPx.h);
  }

  // 指针状态（平滑）
  const cur = { x: 0.5, y: 0.5, last: -1e5 };
  const sm = { x: 0.5, y: 0.5, act: 0 };
  const onMove = e => {
    if (!hero || !hero.isConnected) return;
    const r = hero.getBoundingClientRect();
    if (!r.width || !r.height) return;
    cur.x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    cur.y = 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    cur.last = performance.now();
  };
  hero.addEventListener('mousemove', onMove, { passive: true });
  hero.addEventListener('mouseleave', () => { cur.last = -1e5; });
  hero.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive: true });

  const htmlEl = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dark = htmlEl.dataset.theme !== 'light';
  let inView = true;
  let raf = 0;
  function frame(now) {
    if (!imgReady || imgFailed || !dark || !inView) return;
    const t = now * 0.001;
    const since = performance.now() - cur.last;
    let tx, ty, ta;
    if (since > 2600 && !reduce) {          // 鼠标久未移动：涟漪自动游走，画面持续流动
      tx = 0.5 + 0.42 * Math.sin(t * 0.35);
      ty = 0.5 + 0.36 * Math.cos(t * 0.28);
      ta = 0.6;
    } else { tx = cur.x; ty = cur.y; ta = 1; }
    sm.x += (tx - sm.x) * 0.09;
    sm.y += (ty - sm.y) * 0.09;
    sm.act += (ta - sm.act) * 0.05;
    gl.uniform1i(U.u_image, 0);
    gl.uniform2f(U.u_res, W, H);
    gl.uniform2f(U.u_imgRes, imgPx.w, imgPx.h);
    gl.uniform1f(U.u_scale, imgPx.scale);
    gl.uniform2f(U.u_mouse, sm.x, sm.y);
    gl.uniform1f(U.u_time, t);
    gl.uniform1f(U.u_act, sm.act);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop(t) { frame(t); if (!reduce) raf = requestAnimationFrame(loop); }
  const want = () => dark && imgReady && inView && !imgFailed;
  function refresh() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (!want()) return;
    if (reduce) { frame(0); } else { raf = requestAnimationFrame(loop); }
  }
  new MutationObserver(() => {
    dark = htmlEl.dataset.theme !== 'light';
    if (dark) setTimeout(resize, 0);
    refresh();
  }).observe(htmlEl, { attributes: true, attributeFilter: ['data-theme'] });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => {
      inView = es[0].isIntersecting;
      if (inView) resize();
      refresh();
    }, { threshold: 0.02 }).observe(hero);
  }
  window.addEventListener('resize', () => { resize(); refresh(); }, { passive: true });
  resize();
  refresh();
})();
</script>
